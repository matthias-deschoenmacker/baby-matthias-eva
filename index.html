<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby status</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-50 to-pink-50 text-slate-800 flex items-center justify-center p-4">
  <main class="w-full max-w-md text-center">
    <h1 class="text-sm font-semibold uppercase tracking-widest text-slate-500 mb-6">Baby status</h1>

    <div id="card" class="rounded-3xl bg-white shadow-xl p-8 transition-all">
      <div id="emoji" class="text-7xl mb-4">⏳</div>
      <p id="label" class="text-3xl font-bold">Laden…</p>
      <p id="message" class="mt-4 text-slate-600 hidden"></p>
    </div>

    <ol id="steps" class="mt-8 flex justify-between text-xs text-slate-400"></ol>

    <p id="updated" class="mt-6 text-xs text-slate-400"></p>
  </main>

  <script>
    const STATUSES = [
      { key: 'thuis',      emoji: '🏠', label: 'Nog thuis',          ring: 'ring-sky-300' },
      { key: 'ziekenhuis', emoji: '🏥', label: 'In het ziekenhuis',  ring: 'ring-amber-300' },
      { key: 'geboren',    emoji: '👶', label: 'Geboren!',           ring: 'ring-pink-300' },
    ];
    const REFRESH_MS = 60_000;

    const $ = (id) => document.getElementById(id);

    function render(data) {
      const index = STATUSES.findIndex((s) => s.key === data.status);
      const current = STATUSES[index] ?? STATUSES[0];
      // The name lives only in status.json, so it stays secret until the birth.
      const label = current.key === 'geboren' && data.name ? `${data.name} is geboren!` : current.label;

      $('emoji').textContent = current.emoji;
      $('label').textContent = label;
      $('card').className = `rounded-3xl bg-white shadow-xl p-8 transition-all ring-4 ${current.ring}`;

      $('message').textContent = data.message || '';
      $('message').classList.toggle('hidden', !data.message);

      $('steps').innerHTML = '';
      STATUSES.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = `flex-1 ${i <= index ? 'text-slate-700 font-semibold' : ''}`;
        li.textContent = `${s.emoji} ${s.label.replace('!', '')}`;
        $('steps').appendChild(li);
      });

      $('updated').textContent = data.updated
        ? `Laatst bijgewerkt: ${new Date(data.updated).toLocaleString('nl-BE', { dateStyle: 'medium', timeStyle: 'short' })}`
        : '';

      document.title = `${current.emoji} ${label}`;
    }

    async function load() {
      try {
        // Cache-buster: hosts like GitHub Pages cache static files for minutes.
        const res = await fetch(`status.json?t=${Date.now()}`, { cache: 'no-store' });
        render(await res.json());
      } catch {
        $('label').textContent = 'Status niet beschikbaar';
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
